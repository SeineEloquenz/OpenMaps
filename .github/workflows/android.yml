name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.4.1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Test and assemble debug
        run: ./gradlew allTests :app:android:testDebugUnitTest :app:android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/android/build/outputs/apk/debug
